<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">

<style>

* {
    box-sizing: border-box;
    user-select: none;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, "Yu Gothic", sans-serif;
}

#game {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: #000;
}

#canvas {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    display: block;
}


/* =========================
   UI
========================= */

#ui {
    position: fixed;
    left: 20px;
    top: 20px;
    z-index: 10;
    padding: 14px 18px;
    min-width: 250px;
    color: white;
    background: rgba(0, 0, 0, 0.72);
    border-radius: 10px;
    pointer-events: none;
}

#title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 5px;
}

#timer {
    font-size: 28px;
    font-weight: bold;
}

#best {
    margin-top: 3px;
    font-size: 13px;
    color: #ffd700;
}

#discordUser {
    margin-top: 8px;
    font-size: 13px;
    color: #8ea8ff;
    pointer-events: none;
}


/* =========================
   RANKING BUTTON
========================= */

#rankingButton {
    position: fixed;
    right: 20px;
    top: 20px;

    /* START画面より上、ランキング画面より下 */
    z-index: 25;

    border: 0;
    padding: 12px 18px;

    border-radius: 10px;

    background: rgba(0, 0, 0, 0.82);
    color: white;

    font-size: 15px;
    font-weight: bold;

    cursor: pointer;
}

#rankingButton:hover {
    transform: scale(1.04);
}


/* =========================
   CONTROLS
========================= */

#controls {
    position: fixed;
    left: 20px;
    bottom: 20px;
    z-index: 10;
    padding: 9px 14px;
    color: white;
    background: rgba(0, 0, 0, 0.65);
    border-radius: 8px;
    font-size: 13px;
    pointer-events: none;
}


/* =========================
   START
========================= */

#startScreen {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    justify-content: center;
    align-items: center;
    background: rgba(0, 0, 0, 0.45);
}

#startBox {
    width: min(420px, 90vw);
    padding: 32px;
    text-align: center;
    color: white;
    background: rgba(0, 0, 0, 0.92);
    border-radius: 18px;
}

#startBox h1 {
    margin: 0 0 15px;
    font-size: 34px;
}

#startBox p {
    line-height: 1.7;
}

#startButton,
#restartButton {
    border: 0;
    padding: 12px 32px;
    border-radius: 10px;
    background: white;
    color: #111;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

#startButton:hover,
#restartButton:hover {
    transform: scale(1.04);
}


/* =========================
   RESULT
========================= */

#message {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    z-index: 30;
    display: none;
    width: min(420px, 90vw);
    padding: 30px;
    text-align: center;
    color: white;
    background: rgba(0, 0, 0, 0.94);
    border-radius: 18px;
}

#messageTitle {
    font-size: 38px;
    font-weight: bold;
    margin-bottom: 12px;
}

#messageTime {
    white-space: pre-line;
    font-size: 22px;
    margin-bottom: 20px;
}


/* =========================
   RANKING
========================= */

#rankingScreen {
    position: fixed;
    inset: 0;

    z-index: 100;

    display: none;

    justify-content: center;
    align-items: center;

    background: rgba(0, 0, 0, 0.72);
}

#rankingBox {
    width: min(500px, 92vw);
    max-height: 90vh;

    padding: 25px;

    color: white;

    background: rgba(10, 10, 10, 0.97);

    border: 1px solid #444;

    border-radius: 18px;

    overflow: hidden;
}

#rankingTitle {
    text-align: center;

    font-size: 28px;
    font-weight: bold;

    margin-bottom: 18px;
}

#rankingList {
    max-height: 55vh;

    overflow-y: auto;

    margin-bottom: 18px;
}

.rankingRow {
    display: grid;

    grid-template-columns:
        55px
        1fr
        110px;

    align-items: center;

    gap: 10px;

    padding: 12px 10px;

    margin-bottom: 6px;

    background: #1b1b1b;

    border-radius: 8px;
}

.rankingRank {
    font-size: 18px;
    font-weight: bold;
}

.rankingName {
    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;

    font-size: 15px;
}

.rankingTime {
    text-align: right;

    font-size: 17px;

    font-weight: bold;
}

.rankingEmpty {
    padding: 30px 10px;

    text-align: center;

    color: #aaa;
}

.rankingError {
    padding: 30px 10px;

    text-align: center;

    color: #ff7777;
}

#rankingButtons {
    display: flex;

    justify-content: center;

    gap: 10px;

    flex-wrap: wrap;
}

#rankingRefreshButton,
#rankingCloseButton {
    border: 0;

    padding: 10px 20px;

    border-radius: 9px;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;
}

#rankingRefreshButton {
    background: white;
    color: #111;
}

#rankingCloseButton {
    background: #444;
    color: white;
}

#rankingRefreshButton:hover,
#rankingCloseButton:hover {
    transform: scale(1.04);
}

#rankingStatus {
    text-align: center;

    margin-bottom: 10px;

    font-size: 13px;

    color: #999;
}


/* =========================
   MOBILE
========================= */

@media (
    max-width: 600px
) {

    #ui {

        top: 10px;
        min-width: 210px;

    }

        right: 10px;
        top: 10px;

    }

    #controls {

    }

        padding: 18px;
    }

            1fr
            90px;

/* =========================================================
   DISCORD USER LOAD
========================================================= */

async function loadDiscordUser() {

    try {

        const params =
            new URLSearchParams(
                window.location.search
            );

        const sessionFromUrl =
            params.get("session");

        if (sessionFromUrl) {

            sessionStorage.setItem(
                "discordSession",
                sessionFromUrl
            );

            window.history.replaceState(
                {},
                document.title,
                window.location.pathname
            );

        }

        const session =
            sessionStorage.getItem(
                "discordSession"
            );

        if (!session) {

            discordUserElement.textContent =
                "Discord: 未ログイン";

            return;

        }

        const response =
            await fetch(
                API_URL + "/api/me",
                {
                    method: "GET",

                    headers: {
                        "Authorization":
                            "Bearer " + session
                    }
                }
            );

        if (!response.ok) {

            sessionStorage.removeItem(
                "discordSession"
            );

            discordUserElement.textContent =
                "Discord: 未ログイン";

            return;

        }

        const user =
            await response.json();

        discordUserElement.textContent =
            "Discord: " +
            user.discord_name;

    }
    catch (error) {

        console.error(
            "Discord情報取得エラー:",
            error
        );

        discordUserElement.textContent =
            "Discord: 未ログイン";

    }

}


/* =========================================================
   SAVE SCORE TO SERVER
========================================================= */

async function saveScoreToServer(time) {

    const session =
        sessionStorage.getItem(
            "discordSession"
        );

    if (!session) {

        console.warn(
            "Discord未ログインのためランキング登録をスキップします。"
        );

        return {
            success: false,
            reason: "not_logged_in"
        };

    }

    try {

        const score =
            Number(
                Number(time).toFixed(2)
            );

        console.log(
            "D1へスコア送信:",
            score
        );

        const response =
            await fetch(
                API_URL + "/api/score",
                {
                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " + session

                    },

                    body: JSON.stringify({

                        time:
                            score

                    })

                }
            );

        let data = null;

        try {

            data =
                await response.json();

        }
        catch (error) {

            data = null;

        }

        console.log(
            "D1レスポンス:",
            response.status,
            data
        );

        if (!response.ok) {

            console.error(
                "スコア保存失敗:",
                response.status,
                data
            );

            return {

                success: false,

                reason:
                    "server_error",

                status:
                    response.status,

                data:
                    data

            };

        }

        console.log(
            "スコア保存成功:",
            data
        );

        return {

            success: true,

            data:
                data

        };

    }
    catch (error) {

        console.error(
            "スコア送信エラー:",
            error
        );

        return {

            success: false,

            reason:
                "network_error",

            error:
                error

        };

    }

}


/* =========================================================
   LOAD RANKING
========================================================= */

async function loadRanking() {

    rankingStatus.textContent =
        "ランキングを読み込み中...";

    rankingList.innerHTML = "";

    try {

        const response =
            await fetch(
                API_URL + "/api/ranking",
                {
                    method: "GET",

                    cache: "no-store"
                }
            );

        let data = null;

        try {

            data =
                await response.json();

        }
        catch (error) {

            data = null;

        }

        console.log(
            "ランキングAPI:",
            response.status,
            data
        );

        if (!response.ok) {

            rankingStatus.textContent =
                "ランキング取得に失敗しました";

            rankingList.innerHTML =
                '<div class="rankingError">サーバーエラーが発生しました</div>';

            return;

        }

        if (
            !data ||
            !Array.isArray(
                data.ranking
            )
        ) {

            rankingStatus.textContent =
                "ランキングデータがありません";

            rankingList.innerHTML =
                '<div class="rankingEmpty">まだランキングがありません</div>';

            return;

        }

        const ranking =
            data.ranking;

        if (
            ranking.length === 0
        ) {

            rankingStatus.textContent =
                "ランキング";

            rankingList.innerHTML =
                '<div class="rankingEmpty">まだ記録がありません</div>';

            return;

        }

        rankingStatus.textContent =
            "TOP " +
            ranking.length;

        for (
            let i = 0;
            i < ranking.length;
            i++
        ) {

            const item =
                ranking[i];

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "rankingRow";

            const rank =
                document.createElement(
                    "div"
                );

            rank.className =
                "rankingRank";

            if (
                item.rank === 1
            ) {

                rank.textContent =
                    "🥇";

            }
            else if (
                item.rank === 2
            ) {

                rank.textContent =
                    "🥈";

            }
            else if (
                item.rank === 3
            ) {

                rank.textContent =
                    "🥉";

            }
            else {

                rank.textContent =
                    item.rank + "位";

            }

            const name =
                document.createElement(
                    "div"
                );

            name.className =
                "rankingName";

            name.textContent =
                item.discord_name ||
                "Unknown";

            const time =
                document.createElement(
                    "div"
                );

            time.className =
                "rankingTime";

            time.textContent =
                Number(
                    item.time
                ).toFixed(2) +
                " 秒";

            row.appendChild(
                rank
            );

            row.appendChild(
                name
            );

            row.appendChild(
                time
            );

            rankingList.appendChild(
                row
            );

        }

    }
    catch (error) {

        console.error(
            "ランキング取得エラー:",
            error
        );

        rankingStatus.textContent =
            "ランキング取得に失敗しました";

        rankingList.innerHTML =
            '<div class="rankingError">通信エラーが発生しました</div>';

    }

}

function resizeCanvas() {

    screenWidth =
        Math.max(1, window.innerWidth);

    screenHeight =
        Math.max(1, window.innerHeight);

    canvas.width =
        Math.max(
            1,
            Math.floor(
                screenWidth *
                RENDER_SCALE
            )
        );

    canvas.height =
        Math.max(
            1,
            Math.floor(
                screenHeight *
                RENDER_SCALE
            )
        );

    canvas.style.width =
        screenWidth + "px";

    canvas.style.height =
        screenHeight + "px";

    ctx.setTransform(
        RENDER_SCALE,
        0,
        0,
        RENDER_SCALE,
        0,
        0
    );

    ctx.imageSmoothingEnabled =
        true;

    render();

}


window.addEventListener(
    "resize",
    resizeCanvas
);

document.addEventListener(
    "keydown",
    function(e) {

        /*
         * ランキング表示中はゲーム操作を停止
         */
        if (
            rankingScreen.style.display ===
            "flex"
        ) {

            if (
                e.key === "Escape"
            ) {

                closeRanking();

            }

            return;

        }


        if (
            e.key === "ArrowLeft" ||
            e.key === "a" ||
            e.key === "A"
        ) {

            leftPressed =
                true;

            e.preventDefault();

        }


        if (
            e.key === "ArrowRight" ||
            e.key === "d" ||
            e.key === "D"
        ) {

            rightPressed =
                true;

            e.preventDefault();

        }


        if (
            e.code === "Space" ||
            e.key === "ArrowUp" ||
            e.key === "w" ||
            e.key === "W"
        ) {

            if (
                !e.repeat
            ) {

                jumpPressed =
                    true;

            }

            e.preventDefault();

        }


        if (
            e.key === "r" ||
            e.key === "R"
        ) {

            if (
                gameStarted ||
                gameFinished
            ) {

                startGame();

            }

        }

    }
);

    ) {

            true;

        "TIME: 0.00";

}


/* =========================================================
   COLLISION
========================================================= */

function rectsOverlap(
    ax,
    ay,
    aw,
    ah,
    bx,
    by,
    bw,
    bh
) {

    return (
        ax < bx + bw &&
        ax + aw > bx &&
        ay < by + bh &&
        ay + ah > by
    );

}


/* =========================================================
   PLAYER HITBOX
========================================================= */

function getPlayerHitbox() {

    return {

        x:
            playerX +
            PLAYER_HITBOX_OFFSET_X,

        y:
            playerY +
            PLAYER_HITBOX_OFFSET_Y,

        w:
            PLAYER_HITBOX_WIDTH,

        h:
            PLAYER_HITBOX_HEIGHT

    };

}


/* =========================================================
   ENEMY HITBOX
========================================================= */

function getEnemyHitbox(enemy) {

    return {

        x:
            enemy.x +
            ENEMY_HITBOX_OFFSET_X,

        y:
            enemy.y +
            ENEMY_HITBOX_OFFSET_Y,

        w:
            ENEMY_HITBOX_WIDTH,

        h:
            ENEMY_HITBOX_HEIGHT

    };

}


/* =========================================================
   MELEE HITBOX
========================================================= */

function getMeleeEnemyHitbox(enemy) {

    return {

        x:
            enemy.x +
            MELEE_HITBOX_OFFSET_X,

        y:
            enemy.y +
            MELEE_HITBOX_OFFSET_Y,

        w:
            MELEE_HITBOX_WIDTH,

        h:
            MELEE_HITBOX_HEIGHT

    };

}


/* =========================================================
   HORIZONTAL MOVEMENT
========================================================= */

function updateHorizontal() {

    let nextX =
        playerX;


    if (leftPressed) {

        nextX -=
            MOVE_SPEED;

    }


    if (rightPressed) {

        nextX +=
            MOVE_SPEED;

    }


    if (
        nextX < 0
    ) {

        nextX =
            0;

    }


    if (
        nextX >
        WORLD_WIDTH -
        PLAYER_WIDTH
    ) {

        nextX =
            WORLD_WIDTH -
            PLAYER_WIDTH;

    }


    const hitbox =
        getPlayerHitbox();

    const top =
        hitbox.y;

    const bottom =
        hitbox.y +
        hitbox.h;


    for (
        let i = 0;
        i < spikes.length;
        i++
    ) {

        const spike =
            spikes[i];


        if (
            bottom <= spike.y ||
            top >= spike.y + 36
        ) {

            continue;

        }


        const currentLeft =
            playerX +
            PLAYER_HITBOX_OFFSET_X;

        const currentRight =
            currentLeft +
            PLAYER_HITBOX_WIDTH;

        const nextLeft =
            nextX +
            PLAYER_HITBOX_OFFSET_X;

        const nextRight =
            nextLeft +
            PLAYER_HITBOX_WIDTH;


        if (
            nextX > playerX
        ) {

            if (
                currentRight <= spike.x &&
                nextRight >= spike.x
            ) {

                nextX =
                    spike.x -
                    PLAYER_HITBOX_OFFSET_X -
                    PLAYER_HITBOX_WIDTH;

            }

        }


        if (
            nextX < playerX
        ) {

            if (
                currentLeft >=
                    spike.x + 36 &&
                nextLeft <=
                    spike.x + 36
            ) {

                nextX =
                    spike.x +
                    36 -
                    PLAYER_HITBOX_OFFSET_X;

            }

        }

    }


    playerX =
        nextX;

}


/* =========================================================
   JUMP
========================================================= */

function updateJump() {

    if (
        jumpPressed &&
        grounded
    ) {

        velocityY =
            -JUMP_POWER;

        grounded =
            false;

        jumpPressed =
            false;

    }

}


/* =========================================================
   GRAVITY
========================================================= */

function updateGravity() {

    velocityY +=
        GRAVITY;

    playerY +=
        velocityY;

}


/* =========================================================
   PLATFORM COLLISION
========================================================= */

function updatePlatforms() {

    grounded =
        false;


    const hitbox =
        getPlayerHitbox();


    const left =
        hitbox.x;

    const right =
        hitbox.x +
        hitbox.w;

    const bottom =
        hitbox.y +
        hitbox.h;

    const previousBottom =
        bottom -
        velocityY;


    for (
        let i = 0;
        i < platforms.length;
        i++
    ) {

        const p =
            platforms[i];


        if (
            p.x + p.w <
                left - 100 ||
            p.x >
                right + 100
        ) {

            continue;

        }


        if (
            right <= p.x ||
            left >= p.x + p.w
        ) {

            continue;

        }


        if (
            velocityY >= 0 &&
            previousBottom <= p.y &&
            bottom >= p.y
        ) {

            playerY =
                p.y -
                PLAYER_HITBOX_HEIGHT -
                PLAYER_HITBOX_OFFSET_Y;

            velocityY =
                0;

            grounded =
                true;

        }

    }

}


/* =========================================================
   SPIKE COLLISION
========================================================= */

function updateSpikes() {

    if (
        velocityY <= 0
    ) {

        return;

    }


    const hitbox =
        getPlayerHitbox();


    const foot =
        hitbox.y +
        hitbox.h;

    const previousFoot =
        foot -
        velocityY;


    const points = [

        hitbox.x + 4,

        hitbox.x +
        hitbox.w / 2,

        hitbox.x +
        hitbox.w -
        4

    ];


    for (
        let i = 0;
        i < spikes.length;
        i++
    ) {

        const spike =
            spikes[i];


        if (
            spike.x + 36 <
                hitbox.x - 40 ||
            spike.x >
                hitbox.x +
                hitbox.w +
                40
        ) {

            continue;

        }


        const center =
            spike.x + 18;


        for (
            let j = 0;
            j < points.length;
            j++
        ) {

            const x =
                points[j];


            if (
                x < spike.x ||
                x > spike.x + 36
            ) {

                continue;

            }


            const surface =
                spike.y +
                Math.abs(
                    x - center
                );


            if (
                previousFoot <= surface &&
                foot >= surface
            ) {

                die();

                return;

            }

        }

    }

}


/* =========================================================
   RANGED ENEMY UPDATE
========================================================= */

function updateRangedEnemies(now) {

    const playerHitbox =
        getPlayerHitbox();


    const minX =
        playerX - 1400;

    const maxX =
        playerX + 1400;


    for (
        let i = 0;
        i < rangedEnemies.length;
        i++
    ) {

        const enemy =
            rangedEnemies[i];


        if (
            !enemy.alive
        ) {

            continue;

        }


        if (
            enemy.x < minX ||
            enemy.x > maxX
        ) {

            continue;

        }


        const enemyHitbox =
            getEnemyHitbox(enemy);


        if (
            rectsOverlap(
                playerHitbox.x,
                playerHitbox.y,
                playerHitbox.w,
                playerHitbox.h,

                enemyHitbox.x,
                enemyHitbox.y,
                enemyHitbox.w,
                enemyHitbox.h
            )
        ) {

            const previousBottom =
                playerHitbox.y +
                playerHitbox.h -
                velocityY;


            if (
                velocityY > 0 &&
                previousBottom <=
                    enemyHitbox.y + 14
            ) {

                enemy.alive =
                    false;

                velocityY =
                    -JUMP_POWER * 0.7;

                grounded =
                    false;

                continue;

            }

            else {

                die();

                return;

            }

        }


        if (
            now -
            enemy.lastShot >=
            enemy.fireRate
        ) {

            if (
                enemy.x === 9600
            ) {

                enemy.shotCount++;


                if (
                    enemy.shotCount % 2 === 0
                ) {

                    createBullet(enemy);

                }

            }

            else {

                createBullet(enemy);

            }


            enemy.lastShot =
                now;

        }

    }

}


/* =========================================================
   CREATE BULLET
========================================================= */

function createBullet(enemy) {

    if (
        bullets.length >=
        MAX_BULLETS
    ) {

        return;

    }


    bullets.push({

        x:
            enemy.x - 5,

        y:
            enemy.y + 3,

        vx:
            -1

    });

}


/* =========================================================
   BULLET UPDATE
========================================================= */

function updateBullets() {

    for (
        let i =
            bullets.length - 1;

        i >= 0;

        i--
    ) {

        const bullet =
            bullets[i];


        bullet.x +=
            bullet.vx;


        if (
            bullet.x <
            playerX - 1600
        ) {

            bullets.splice(
                i,
                1
            );

            continue;

        }


        const hitbox =
            getPlayerHitbox();


        if (
            rectsOverlap(
                bullet.x,
                bullet.y,
                16,
                10,

                hitbox.x,
                hitbox.y,
                hitbox.w,
                hitbox.h
            )
        ) {

            die();

            return;

        }

    }

}


/* =========================================================
   MELEE UPDATE
========================================================= */

function updateMeleeEnemies() {

    for (
        let i = 0;
        i < meleeEnemies.length;
        i++
    ) {

        const enemy =
            meleeEnemies[i];


        if (
            !enemy.alive
        ) {

            continue;

        }


        if (
            Math.abs(
                enemy.x -
                playerX
            ) > 1400
        ) {

            continue;

        }


        let enemyPlatform =
            null;


        for (
            let j = 0;
            j < platforms.length;
            j++
        ) {

            const p =
                platforms[j];


            if (
                enemy.x +
                MELEE_HITBOX_WIDTH <
                    p.x ||
                enemy.x >
                    p.x + p.w
            ) {

                continue;

            }


            if (
                enemy.y +
                MELEE_HITBOX_HEIGHT >=
                    p.y - 2 &&
                enemy.y +
                MELEE_HITBOX_HEIGHT <=
                    p.y + 5
            ) {

                enemyPlatform =
                    p;

                break;

            }

        }


        if (
            enemyPlatform !== null
        ) {

            const hitbox =
                getPlayerHitbox();

            const playerBottom =
                hitbox.y +
                hitbox.h;

            const sameHeight =
                Math.abs(
                    playerBottom -
                    enemyPlatform.y
                ) < 15;

            const playerCenter =
                hitbox.x +
                hitbox.w / 2;

            const samePlatform =
                playerCenter >=
                    enemyPlatform.x &&
                playerCenter <=
                    enemyPlatform.x +
                    enemyPlatform.w;


            if (
                sameHeight &&
                samePlatform
            ) {

                const distance =
                    Math.abs(
                        enemy.x -
                        playerX
                    );


                if (
                    distance < 450
                ) {

                    if (
                        playerX <
                        enemy.x
                    ) {

                        enemy.x -=
                            enemy.speed;

                    }

                    else {

                        enemy.x +=
                            enemy.speed;

                    }


                    const minX =
                        enemyPlatform.x;

                    const maxX =
                        enemyPlatform.x +
                        enemyPlatform.w -
                        MELEE_HITBOX_WIDTH;


                    if (
                        enemy.x <
                        minX
                    ) {

                        enemy.x =
                            minX;

                    }


                    if (
                        enemy.x >
                        maxX
                    ) {

                        enemy.x =
                            maxX;

                    }

                }

            }

        }


        const hitbox =
            getPlayerHitbox();

        const enemyHitbox =
            getMeleeEnemyHitbox(
                enemy
            );


        if (
            rectsOverlap(
                hitbox.x,
                hitbox.y,
                hitbox.w,
                hitbox.h,

                enemyHitbox.x,
                enemyHitbox.y,
                enemyHitbox.w,
                enemyHitbox.h
            )
        ) {

            const previousBottom =
                hitbox.y +
                hitbox.h -
                velocityY;


            if (
                velocityY > 0 &&
                previousBottom <=
                    enemyHitbox.y + 12
            ) {

                enemy.alive =
                    false;

                velocityY =
                    -JUMP_POWER * 0.7;

                grounded =
                    false;

            }

            else {

                die();

                return;

            }

        }

    }

}


/* =========================================================
   FALL
========================================================= */

function updateFall() {

    if (
        playerY >
        screenHeight + 150
    ) {

        die();

    }

}


/* =========================================================
   GOAL
========================================================= */

function updateGoal() {

    const hitbox =
        getPlayerHitbox();


    if (
        rectsOverlap(
            hitbox.x,
            hitbox.y,
            hitbox.w,
            hitbox.h,

            goal.x,
            goal.y,
            goal.w,
            goal.h
        )
    ) {

        win();

    }

}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera() {

    let target =
        playerX -
        screenWidth *
        0.35;


    if (
        target < 0
    ) {

        target =
            0;

    }


    const maxCamera =
        Math.max(
            0,
            WORLD_WIDTH -
            screenWidth
        );


    if (
        target >
        maxCamera
    ) {

        target =
            maxCamera;

    }


    cameraX +=
        (
            target -
            cameraX
        ) *
        CAMERA_SMOOTH;

}


/* =========================================================
   UPDATE
========================================================= */

function update(now) {

    updateHorizontal();

    updateJump();

    updateGravity();

    updatePlatforms();

    updateSpikes();


    if (
        !gameStarted
    ) {

        return;

    }


    updateRangedEnemies(
        now
    );


    if (
        !gameStarted
    ) {

        return;

    }


    updateMeleeEnemies();


    if (
        !gameStarted
    ) {

        return;

    }


    updateBullets();


    if (
        !gameStarted
    ) {

        return;

    }


    updateFall();


    if (
        !gameStarted
    ) {

        return;

    }


    updateGoal();


    if (
        !gameStarted
    ) {

        return;

    }


    updateCamera();

}


/* =========================================================
   DRAW BACKGROUND
========================================================= */

function drawBackground() {

    ctx.fillStyle =
        "#000000";

    ctx.fillRect(
        0,
        0,
        screenWidth,
        screenHeight
    );

}


/* =========================================================
   DRAW PLATFORM
========================================================= */

function drawPlatform(p) {

    const x =
        p.x - cameraX;

    const y =
        p.y;


    if (
        x + p.w < 0 ||
        x > screenWidth
    ) {

        return;

    }


    ctx.fillStyle =
        "#555";

    ctx.fillRect(
        x,
        y,
        p.w,
        p.h
    );


    ctx.fillStyle =
        "#777";

    ctx.fillRect(
        x,
        y,
        p.w,
        4
    );


    ctx.fillStyle =
        "#333";

    ctx.fillRect(
        x,
        y + p.h - 4,
        p.w,
        4
    );

}


/* =========================================================
   DRAW SPIKE
========================================================= */

function drawSpike(spike) {

    const x =
        spike.x -
        cameraX;

    const y =
        spike.y;


    if (
        x + 36 < 0 ||
        x > screenWidth
    ) {

        return;

    }


    ctx.fillStyle =
        "#222";


    ctx.beginPath();

    ctx.moveTo(
        x,
        y + 36
    );

    ctx.lineTo(
        x + 18,
        y
    );

    ctx.lineTo(
        x + 36,
        y + 36
    );

    ctx.closePath();

    ctx.fill();


    ctx.fillStyle =
        "#555";


    ctx.beginPath();

    ctx.moveTo(
        x + 18,
        y
    );

    ctx.lineTo(
        x + 22,
        y + 36
    );

    ctx.lineTo(
        x + 18,
        y + 36
    );

    ctx.closePath();

    ctx.fill();

}

            "rangedEnemy.pngを読み込めません。代替描画を使用します。"
        );

        render();

    };


const meleeEnemyImage =
    new Image();

meleeEnemyImage.src =
    "meleeEnemy.png";

let meleeEnemyImageLoaded =
    false;


meleeEnemyImage.onload =
    function() {

        meleeEnemyImageLoaded =
            true;

        render();

    };


meleeEnemyImage.onerror =
    function() {

        meleeEnemyImageLoaded =
            false;

        console.warn(
            "meleeEnemy.pngを読み込めません。代替描画を使用します。"
        );

        render();

    };


/* =========================================================
   DRAW PLAYER
========================================================= */

function drawPlayer() {

    const x =
        playerX -
        cameraX;

    const y =
        playerY;


    if (
        playerImageLoaded
    ) {

        ctx.drawImage(
            playerImage,
            x,
            y,
            PLAYER_WIDTH,
            PLAYER_HEIGHT
        );

        return;

    }


    ctx.fillStyle =
        "#ff4444";


    ctx.fillRect(
        x,
        y,
        PLAYER_WIDTH,
        PLAYER_HEIGHT
    );


    ctx.strokeStyle =
        "#9b0000";

    ctx.lineWidth =
        3;


    ctx.strokeRect(
        x + 1.5,
        y + 1.5,
        PLAYER_WIDTH - 3,
        PLAYER_HEIGHT - 3
    );


    ctx.fillStyle =
        "#fff";


    ctx.fillRect(
        x + 8,
        y + 8,
        5,
        5
    );

    ctx.fillRect(
        x + 23,
        y + 8,
        5,
        5
    );

}


/* =========================================================
   DRAW RANGED ENEMY
========================================================= */

function drawRangedEnemy(enemy) {

    if (
        !enemy.alive
    ) {

        return;

    }


    const x =
        enemy.x -
        cameraX -
        ENEMY_HITBOX_OFFSET_X;


    const y =
        enemy.y -
        (
            ENEMY_HEIGHT -
            ENEMY_HITBOX_HEIGHT
        );


    if (
        x + ENEMY_WIDTH < 0 ||
        x > screenWidth
    ) {

        return;

    }


    if (
        rangedEnemyImageLoaded
    ) {

        ctx.drawImage(
            rangedEnemyImage,
            x,
            y,
            ENEMY_WIDTH,
            ENEMY_HEIGHT
        );

        return;

    }


    ctx.fillStyle =
        "#5c2d91";


    ctx.fillRect(
        x,
        y,
        ENEMY_WIDTH,
        ENEMY_HEIGHT
    );


    ctx.strokeStyle =
        "#35165c";

    ctx.lineWidth =
        4;


    ctx.strokeRect(
        x + 2,
        y + 2,
        ENEMY_WIDTH - 4,
        ENEMY_HEIGHT - 4
    );


    ctx.fillStyle =
        "#fff";


    ctx.fillRect(
        x + 8,
        y + 8,
        5,
        5
    );

    ctx.fillRect(
        x + 25,
        y + 8,
        5,
        5
    );


    ctx.fillStyle =
        "#ff5555";


    ctx.fillRect(
        x + 9,
        y + ENEMY_HEIGHT - 15,
        18,
        6
    );

}


/* =========================================================
   DRAW MELEE
========================================================= */

function drawMeleeEnemy(enemy) {

    if (
        !enemy.alive
    ) {

        return;

    }


    const x =
        enemy.x -
        cameraX -
        MELEE_HITBOX_OFFSET_X;


    const y =
        enemy.y -
        MELEE_HITBOX_OFFSET_Y;


    if (
        x + ENEMY_WIDTH < 0 ||
        x > screenWidth
    ) {

        return;

    }


    if (
        meleeEnemyImageLoaded
    ) {

        ctx.drawImage(
            meleeEnemyImage,
            x,
            y,
            ENEMY_WIDTH,
            ENEMY_HEIGHT
        );

        return;

    }


    ctx.fillStyle =
        "#b83280";


    ctx.fillRect(
        x,
        y,
        ENEMY_WIDTH,
        ENEMY_HEIGHT
    );


    ctx.strokeStyle =
        "#651443";

    ctx.lineWidth =
        4;


    ctx.strokeRect(
        x + 2,
        y + 2,
        ENEMY_WIDTH - 4,
        ENEMY_HEIGHT - 4
    );


    ctx.fillStyle =
        "#fff";


    ctx.fillRect(
        x + 8,
        y + 8,
        5,
        5
    );

    ctx.fillRect(
        x + 25,
        y + 8,
        5,
        5
    );


    ctx.strokeStyle =
        "#ddd";

    ctx.lineWidth =
        5;


    ctx.beginPath();

    ctx.moveTo(
        x + ENEMY_WIDTH - 6,
        y + ENEMY_HEIGHT - 11
    );

    ctx.lineTo(
        x + ENEMY_WIDTH + 18,
        y + 20
    );

    ctx.stroke();


    ctx.strokeStyle =
        "#704214";

    ctx.lineWidth =
        4;


    ctx.beginPath();

    ctx.moveTo(
        x + ENEMY_WIDTH - 9,
        y + ENEMY_HEIGHT - 8
    );

    ctx.lineTo(
        x + ENEMY_WIDTH + 1,
        y + ENEMY_HEIGHT - 18
    );

    ctx.stroke();

}


/* =========================================================
   DRAW BULLET
========================================================= */

function drawBullet(bullet) {

    const x =
        bullet.x -
        cameraX;

    const y =
        bullet.y;


    if (
        x + 16 < 0 ||
        x > screenWidth
    ) {

        return;

    }


    ctx.fillStyle =
        "#2196ff";


    ctx.fillRect(
        x,
        y,
        16,
        10
    );


    ctx.fillStyle =
        "#fff3a0";


    ctx.fillRect(
        x + 2,
        y + 2,
        8,
        3
    );

}


/* =========================================================
   DRAW GOAL
========================================================= */

function drawGoal() {

    const x =
        goal.x -
        cameraX;

    const y =
        goal.y;


    if (
        x + goal.w < 0 ||
        x > screenWidth
    ) {

        return;

    }


    ctx.fillStyle =
        "#ffd700";


    ctx.fillRect(
        x,
        y,
        goal.w,
        goal.h
    );


    ctx.strokeStyle =
        "#a87900";

    ctx.lineWidth =
        5;


    ctx.strokeRect(
        x + 2.5,
        y + 2.5,
        goal.w - 5,
        goal.h - 5
    );


    ctx.fillStyle =
        "#5a4200";

    ctx.font =
        "bold 10px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";


    ctx.fillText(
        "GOAL",
        x + goal.w / 2,
        y + goal.h / 2
    );

}


/* =========================================================
   RENDER
========================================================= */

function render() {

    if (
        !ctx ||
        !canvas
    ) {

        return;

    }


    drawBackground();


    for (
        let i = 0;
        i < platforms.length;
        i++
    ) {

        drawPlatform(
            platforms[i]
        );

    }


    for (
        let i = 0;
        i < spikes.length;
        i++
    ) {

        drawSpike(
            spikes[i]
        );

    }


    drawGoal();


    for (
        let i = 0;
        i < rangedEnemies.length;
        i++
    ) {

        drawRangedEnemy(
            rangedEnemies[i]
        );

    }


    for (
        let i = 0;
        i < meleeEnemies.length;
        i++
    ) {

        drawMeleeEnemy(
            meleeEnemies[i]
        );

    }


    for (
        let i = 0;
        i < bullets.length;
        i++
    ) {

        drawBullet(
            bullets[i]
        );

    }


    drawPlayer();

}


/* =========================================================
   TIMER
========================================================= */

function updateTimer(now) {

    if (
        now -
        lastTimerUpdate <
        100
    ) {

        return;

    }


    lastTimerUpdate =
        now;


    const elapsed =
        (
            now -
            startTime
        ) / 1000;


    timerElement.textContent =
        "TIME: " +
        elapsed.toFixed(2);

}


/* =========================================================
   DIE
========================================================= */

function die() {

    if (
        !gameStarted
    ) {

        return;

    }


    gameStarted =
        false;

    gameFinished =
        true;


    messageTitle.textContent =
        "💀 死にましたｗ";


    messageTime.textContent =
        "Rキー またはボタンで\nもう一度挑戦";


    message.style.display =
        "block";


    render();

}


/* =========================================================
   WIN
========================================================= */

async function win() {

    if (
        !gameStarted
    ) {

        return;

    }


    gameStarted =
        false;

    gameFinished =
        true;


    const time =
        (
            performance.now() -
            startTime
        ) / 1000;


    const formatted =
        time.toFixed(2);


    messageTitle.textContent =
        "🏆 GOAL!!";


    messageTime.textContent =
        formatted +
        " 秒";


    /* =========================
       LOCAL BEST
    ========================= */

    if (
        bestTime === null ||
        time < Number(bestTime)
    ) {

        bestTime =
            time;


        try {

            localStorage.setItem(
                "athleticBestTime",
                String(time)
            );

        }
        catch (e) {

            console.warn(
                "BEST記録を保存できません:",
                e
            );

        }


        bestElement.textContent =
            "BEST: " +
            formatted +
            " 秒";


        messageTime.textContent +=
            "\n🎉 NEW RECORD!!";

    }


    message.style.display =
        "block";


    render();


    /* =========================
       D1へ保存
    ========================= */

    const result =
        await saveScoreToServer(
            time
        );


    if (
        result &&
        result.success
    ) {

        console.log(
            "✅ ランキング登録完了",
            result.data
        );

    }
    else {

        console.warn(
            "⚠️ ランキング登録されませんでした",
            result
        );

    }

}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(now) {

    try {

        if (
            gameStarted
        ) {

            update(now);


            if (
                gameStarted
            ) {

                updateTimer(now);

            }


            render();

        }

    }
    catch (error) {

        console.error(
            "GAME LOOP ERROR:",
            error
        );

    }


    requestAnimationFrame(
        gameLoop
    );

}


/* =========================================================
   INITIALIZE
========================================================= */

try {

    resizeCanvas();

}
catch (error) {

    console.error(
        "Canvas initialization error:",
        error
    );

    screenWidth =
        Math.max(1, window.innerWidth);

    screenHeight =
        Math.max(1, window.innerHeight);

    canvas.width =
        screenWidth;

    canvas.height =
        screenHeight;

    render();

}


/* =========================================================
   DISCORD USER LOAD
========================================================= */

loadDiscordUser();


/* =========================================================
   GAME START
========================================================= */

requestAnimationFrame(
    gameLoop
);

</script>
